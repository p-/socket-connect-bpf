name: Go
on: [push]

permissions:
  contents: read

jobs:

  build:
    name: Build
    runs-on: "ubuntu-26.04"
    steps:

    - name: Set up Go
      uses: actions/setup-go@v7.1.0
      with:
        go-version: '1.26'
      id: go

    - name: Check out code into the Go module directory
      uses: actions/checkout@v7.0.1

    - name: Install BPF build tools
      run: sudo apt-get update && sudo apt-get install -y clang-19 llvm-19

    - name: Update AS Data
      run: ./updateASData.sh

    - name: Make all (go generate, build + test)
      run: make all

    - name: Smoke Test
      run: |
        for sig in INT TERM; do
          sudo timeout --foreground --verbose --preserve-status --signal="$sig" --kill-after=5s 10s ./bin/amd64/socket-connect-bpf -a || exit $?
        done

    - name: Create Build Artifact
      run: |
        mkdir -p bin/amd64/as
        mkdir -p bin/arm64/as
        cp ./README.md bin/amd64/
        cp ./README.md bin/arm64/
        cp as/*.tsv bin/amd64/as/
        cp as/*.tsv bin/arm64/as/
        mkdir artifacts
        tar czf artifacts/socket-connect-bpf-linux-amd64.tar.gz --directory=bin/amd64/ .
        tar czf artifacts/socket-connect-bpf-linux-arm64.tar.gz --directory=bin/arm64/ .

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: socket-connect-bpf
        path: artifacts
